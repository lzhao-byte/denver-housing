[project]
name = "denver-housing"
version = "1.1.0"
description = "Denver single-family housing analytics: price models and a Plotly Dash app"
readme = "ReadMe.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=3.0,<5",  # dash_table.DataTable is slated for removal in a future major
    "dash-bootstrap-components>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=6.0",  # MapLibre map traces (choroplethmap, scattermap)
    "xgboost>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["Notebooks"]

[tool.ruff.lint]
# Real errors only (pycodestyle E4/E7/E9, pyflakes); line length is not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
